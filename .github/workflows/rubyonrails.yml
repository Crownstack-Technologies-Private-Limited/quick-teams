name: "Ruby on Rails CI"
on:
  push:
    branches: [ "dev", "upgrade" ]
  pull_request:
    branches: [ "dev", "upgrade" ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1 # reads .ruby-version
        with:
          bundler-cache: true
      - name: Brakeman
        run: bundle exec brakeman -q --no-pager
      - name: bundler-audit
        run: bundle exec bundle-audit check --update

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: System packages (ImageMagick for Active Storage variants)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
      - uses: ruby/setup-ruby@v1 # reads .ruby-version
        with:
          bundler-cache: true
      - name: Set up database
        run: bin/rails db:prepare
      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build
      - name: Validate Solid Queue configuration (production config, throwaway database)
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: ci-only-not-a-secret
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci_production
        run: bin/rails db:prepare && bin/rails solid_queue:check
      # Tests run in parallel: one forked worker (own database and storage directory) per core. System tests
      # drive headless Chrome (preinstalled on the runner); set HEADED=1 locally to watch one.
      - name: Unit and component tests
        run: PARALLEL_WORKERS=$(nproc) bin/rails test
      - name: System tests (Selenium + headless Chrome)
        run: PARALLEL_WORKERS=$(nproc) bin/rails test test/system
      - name: Keep screenshots of failed system tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
