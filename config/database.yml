default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# Local development/test talk to the Postgres container from docker-compose.yml
# (published on 5433). Override any of these with environment variables; set
# DB_NAME to give a checkout/worktree its own pair of databases.
local: &local
  <<: *default
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5433 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>

# Development and test use a single database: Active Job runs on the async
# adapter and Action Cable on the async/test adapters.
development:
  <<: *local
  database: <%= ENV.fetch("DB_NAME") { "quickteams" } %>_development

test:
  <<: *local
  database: <%= ENV.fetch("DB_NAME") { "quickteams" } %>_test

# Production and staging: primary + Solid Queue + Solid Cable databases.
# QUEUE_DATABASE_URL / CABLE_DATABASE_URL fall back to DATABASE_URL, but db:prepare cannot set up all three
# schemas in one fresh database (it loads schema.rb, then only runs db/queue_migrate): use separate databases.
production: &deployed
  primary: &primary
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  queue:
    <<: *primary
    url: <%= ENV.fetch("QUEUE_DATABASE_URL") { ENV["DATABASE_URL"] } %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary
    url: <%= ENV.fetch("CABLE_DATABASE_URL") { ENV["DATABASE_URL"] } %>
    migrations_paths: db/cable_migrate

staging:
  <<: *deployed
