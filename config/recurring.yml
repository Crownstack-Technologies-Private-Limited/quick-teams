# Recurring jobs for Solid Queue (replace the old sidekiq-scheduler.yml).
# Times are UTC: config.time_zone is not set, the same as under sidekiq-scheduler.

# Weekly activity report - every Monday at 10:00 AM
send_weekly_activity_report:
  class: WeeklyActivityMailerJob
  queue: default
  schedule: every Monday at 10:00am

# Delete old timesheets - daily at midnight
delete_timesheets_after_x_days:
  class: DeleteTimesheetsJob
  queue: default
  schedule: every day at midnight

# Delete deactivated users - daily at midnight
delete_deactivated_users_after_x_days:
  class: DeleteDeactivatedUsersJob
  queue: default
  schedule: every day at midnight

# Delete archived projects - daily at midnight
delete_archived_projects_after_x_days:
  class: DeleteArchivedProjectsJob
  queue: default
  schedule: every day at midnight

# Housekeeping: remove finished Solid Queue jobs (kept for clear_finished_jobs_after, 1 day by default)
clear_solid_queue_finished_jobs:
  command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
  queue: default
  schedule: every hour at minute 12
